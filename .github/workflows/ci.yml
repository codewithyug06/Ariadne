name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test / mypy / ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.11"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check ariadne eval tests scripts

      - name: mypy --strict
        run: uv run mypy --strict ariadne

      - name: pytest
        run: uv run pytest tests/unit tests/integration -q

  demo-verification:
    name: Ariadne demo verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.11"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --extra embeddings

      - name: Start demo tool server
        run: uv run uvicorn demo.tool_server.server:app --port 8001 --log-level warning &

      - name: Start Ariadne
        env:
          UPSTREAM_MCP_URL: http://localhost:8001/mcp
        run: |
          uv run uvicorn ariadne.main:app --port 8000 --log-level warning &
          for i in $(seq 1 60); do curl -sf http://localhost:8000/health && break; sleep 2; done

      - name: Run demo (direct mode, no n8n dependency in CI)
        run: uv run python demo/scripts/run_demo.py --direct

      - name: Verify demo
        run: uv run python demo/scripts/verify_demo.py

  dependency-audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.11"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: pip-audit
        run: uvx pip-audit --requirement <(uv pip freeze) --strict

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-image-scan:
    name: Container image vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ariadne:ci .

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: "ariadne:ci"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

  dashboard:
    name: Dashboard typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  # ─────────────────────────────────────────────────────────────────────────
  # CD: runs only on push to main, after every check above has passed.
  # ─────────────────────────────────────────────────────────────────────────

  deploy-dashboard:
    name: Deploy dashboard to Vercel
    needs: dashboard
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    # Requires repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
    # (from `vercel link` run once locally against the Vercel project), and a
    # VITE_ARIADNE_API_URL production env var set in the Vercel project
    # settings pointing at Ariadne's real public URL (e.g.
    # https://ariadne.yourcompany.com) -- see dashboard/src/api/client.ts.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  publish-backend-image:
    name: Publish Ariadne image to GHCR
    needs: [test, docker-image-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Publishes to ghcr.io/<owner>/<repo>:latest and :<commit-sha>. Pull this
    # image on whatever host runs docker-compose.prod.yml (Fly.io, Railway,
    # a VPS) -- Vercel cannot run the Ariadne backend (see docker-compose.prod.yml
    # header comment: WebSockets, SQLite persistence, and the GPU embedding
    # model all need a long-lived process, not a serverless function).
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
