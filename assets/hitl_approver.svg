<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="operatorBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <filter id="shieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Security Officer / HITL Operator Head Silhouette -->
  <circle cx="50" cy="36" r="16" fill="url(#skinGrad)" stroke="#38BDF8" stroke-width="2" />
  
  <!-- Operator Shoulders / Uniform -->
  <path d="M26 78 C26 56, 36 52, 50 52 C64 52, 74 56, 74 78" fill="#1E293B" stroke="#38BDF8" stroke-width="2" />

  <!-- Operator Security Comms Headset -->
  <path d="M34 36 C34 22, 66 22, 66 36" stroke="#38BDF8" stroke-width="3" fill="none" stroke-linecap="round" />
  <rect x="31" y="30" width="6" height="12" rx="3" fill="#0284C7" />
  <rect x="63" y="30" width="6" height="12" rx="3" fill="#0284C7" />
  <!-- Microphone Boom extending to mouth -->
  <path d="M34 40 L44 46" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="45" cy="46.5" r="2.5" fill="#38BDF8" />

  <!-- Cryptographic Single-Use Approval Token / Shield in foreground -->
  <g transform="translate(48, 48)">
    <circle cx="20" cy="20" r="18" fill="#064E3B" stroke="url(#shieldGrad)" stroke-width="2.5" filter="url(#shieldGlow)" />
    <!-- Checkmark inside approval token -->
    <path d="M12 20 L17 25 L28 14" stroke="#34D399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Mini Key / Token Notch -->
    <circle cx="20" cy="8" r="2" fill="#34D399" />
  </g>
</svg>
