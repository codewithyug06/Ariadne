<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="botChassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="visorBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="80%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </radialGradient>
    <filter id="neonFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Antenna with signal pulse -->
  <line x1="50" y1="20" x2="50" y2="10" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="50" cy="8" r="4.5" fill="#38BDF8" filter="url(#neonFilter)" />
  <path d="M41 8 A9 9 0 0 1 59 8" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Robot Head Exterior Shell -->
  <rect x="18" y="20" width="64" height="54" rx="20" fill="url(#visorBg)" stroke="url(#botChassis)" stroke-width="3.5" />

  <!-- Ear / Audio Ports -->
  <rect x="12" y="38" width="6" height="18" rx="3" fill="#0284C7" />
  <rect x="82" y="38" width="6" height="18" rx="3" fill="#0284C7" />

  <!-- Inner Visor Display -->
  <rect x="25" y="29" width="50" height="30" rx="12" fill="#020617" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1.5" />

  <!-- Glowing Cyan Eyes -->
  <circle cx="39" cy="44" r="6" fill="url(#eyeGlow)" filter="url(#neonFilter)" />
  <circle cx="41" cy="42" r="2" fill="#FFFFFF" />
  
  <circle cx="61" cy="44" r="6" fill="url(#eyeGlow)" filter="url(#neonFilter)" />
  <circle cx="63" cy="42" r="2" fill="#FFFFFF" />

  <!-- Neural Tool Voice / Activity Bar -->
  <path d="M40 64 L60 64" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
  <path d="M44 68 L56 68" stroke="rgba(56, 189, 248, 0.5)" stroke-width="2" stroke-linecap="round" />

  <!-- MCP / LLM Sub-deck Indicator Buttons -->
  <circle cx="35" cy="82" r="3.5" fill="#38BDF8" />
  <rect x="44" y="79" width="12" height="6" rx="3" fill="#A855F7" />
  <circle cx="65" cy="82" r="3.5" fill="#38BDF8" />
</svg>
